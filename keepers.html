<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keepers · O8FFL</title>
<meta name="description" content="O8FFL keeper options by team with each player's draft round history.">
<meta name="theme-color" content="#0a0e13">
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/site.css?v=d09c04f1">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">O8</span>
      <span class="brand-text">Original 8<small>Fantasy Football</small></span>
    </a>
    <span class="header-spacer"></span>
    <nav class="site-nav" id="nav"></nav>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme">☾</button>
    <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-label="Menu">☰</button>
  </div>
</header>

<div class="wrap page-head">
  <p class="eyebrow">Keepers</p>
  <h1>Keeper board</h1>
  <p>Every rostered player, what it costs to keep them, and where they have gone in past drafts. Tap a player for full history.</p>
</div>

<main class="wrap">
  <div class="toolbar">
    <div class="field"><input id="search" type="search" placeholder="Search players…" autocomplete="off" spellcheck="false"></div>
    <select class="input" id="ownerFilter" style="flex:0 1 190px" aria-label="Filter by owner"><option value="">All teams</option></select>
    <select class="input" id="sortBy" style="flex:0 1 170px" aria-label="Sort by">
      <option value="cost">Cost: earliest round first</option>
      <option value="cost-desc">Cost: latest round first</option>
      <option value="name">Player name</option>
      <option value="contract">Contract years left</option>
    </select>
    <label class="badge badge-plain" style="cursor:pointer;padding:8px 12px"><input type="checkbox" id="onlyEligible" style="margin-right:6px"> Keepable only</label>
  </div>
  <div id="keeperSummary" class="section" style="margin-top:0"></div>
  <div id="keeperView"><div class="loading">Loading…</div></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>Original 8 Fantasy Football League · <span id="footYear"></span></span>
    <span id="footStamp"></span>
  </div>
</footer>

<script type="module" src="assets/js/page-keepers.js?v=d09c04f1"></script>
</body>
</html>
